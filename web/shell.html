<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04090f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cronos++">
  <title>Protocolo Cronos++: O Bunker Submerso</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #04090f; overflow: hidden; overscroll-behavior: none; position: fixed; inset: 0; }
    body { color: #8fe9f3; font-family: system-ui, sans-serif; }
    canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 62.5vw; outline: none; touch-action: none;
             -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; pointer-events: none; }
    #barra { width: min(320px, 70vw); height: 6px; background: #12303c; border-radius: 3px; overflow: hidden; }
    #barra > div { height: 100%; width: 0; background: #46dceb; transition: width .15s; }
  </style>
</head>
<body>
  <div id="carregando"><div>Protocolo Cronos++</div><div id="barra"><div id="progresso"></div></div><div id="msg">Carregando…</div></div>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) {
        var m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(t);
        if (m) document.getElementById('progresso').style.width = (100 * m[1] / m[2]) + '%';
        if (!t) document.getElementById('carregando').style.display = 'none';
      },
      onAbort: function () { document.getElementById('msg').textContent = 'Erro ao iniciar o jogo.'; }
    };
    // Celular: entra em tela cheia (e trava na horizontal) no primeiro toque; o iPhone nao permite isso em paginas web
    // (use Compartilhar > Adicionar a Tela de Inicio).
    (function () {
      function cheia() {
        var d = document, e = d.documentElement;
        if (d.fullscreenElement || d.webkitFullscreenElement) return;
        var pedir = e.requestFullscreen || e.webkitRequestFullscreen;
        if (!pedir) return;
        try {
          var p = pedir.call(e, { navigationUI: 'hide' });
          if (p && p.then) p.then(function () {
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
          }).catch(function () {});
        } catch (err) {}
      }
      window.addEventListener('touchend', cheia, true);
    })();
    // O Safari do iOS inclui as barras do navegador em 100vh e corta a parte de baixo do jogo.
    // Por isso o tamanho do canvas e calculado em pixels a partir da area realmente visivel (visualViewport).
    (function () {
      var c = document.getElementById('canvas');
      function ajustar() {
        var vv = window.visualViewport;
        var w = vv ? vv.width : window.innerWidth, h = vv ? vv.height : window.innerHeight;
        // O canvas tem exatamente a proporcao da tela do jogo (largura calculada como no C++), centralizado: assim nao ha
        // margem escondida e a posicao do dedo vira posicao no jogo por simples proporcao.
        var W = Math.max(1024, Math.min(Math.round(640 * w / h), 1600)); W -= W % 2;
        var e = Math.min(w / W, h / 640);
        var cw = Math.floor(W * e), ch = Math.floor(640 * e);
        c.style.setProperty('width', cw + 'px', 'important');
        c.style.setProperty('height', ch + 'px', 'important');
        c.style.setProperty('left', Math.floor((w - cw) / 2) + 'px', 'important');
        c.style.setProperty('top', Math.floor((h - ch) / 2) + 'px', 'important');
        document.body.style.height = h + 'px';
        window.scrollTo(0, 0);
        if (/[?&]debug/.test(location.search)) {      // abra a pagina com ?debug para ver as medidas na tela
          var d = document.getElementById('dbg');
          if (!d) { d = document.createElement('div'); d.id = 'dbg'; d.style.cssText = 'position:fixed;left:4px;top:4px;z-index:9;font:12px monospace;color:#ff0;background:#000a;padding:3px;pointer-events:none'; document.body.appendChild(d); }
          var r = c.getBoundingClientRect();
          d.textContent = 'inner ' + innerWidth + 'x' + innerHeight + ' | vv ' + Math.round(w) + 'x' + Math.round(h) + ' | canvas ' + Math.round(r.width) + 'x' + Math.round(r.height) + ' @' + Math.round(r.left) + ',' + Math.round(r.top) + ' | v8';
        }
      }
      window.addEventListener('resize', ajustar);
      window.addEventListener('orientationchange', function () { setTimeout(ajustar, 200); });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', ajustar);
      ajustar();
      setInterval(ajustar, 500);     // as barras do Safari aparecem/somem sem avisar
    })();
    // Toque: a posicao do dedo e lida aqui, em relacao ao retangulo real do canvas, e entregue ao jogo (cronos_toque).
    (function () {
      var c = document.getElementById('canvas');
      function enviar(tipo, ev) {
        if (!Module._cronos_toque) return;
        var r = c.getBoundingClientRect();
        for (var i = 0; i < ev.changedTouches.length; i++) {
          var t = ev.changedTouches[i];
          Module._cronos_toque(tipo, t.identifier, (t.clientX - r.left) / r.width, (t.clientY - r.top) / r.height);
        }
        ev.preventDefault();
      }
      var o = { passive: false, capture: true };
      c.addEventListener('touchstart', function (e) { enviar(0, e); }, o);
      c.addEventListener('touchmove', function (e) { enviar(1, e); }, o);
      c.addEventListener('touchend', function (e) { enviar(2, e); }, o);
      c.addEventListener('touchcancel', function (e) { enviar(2, e); }, o);
    })();
    document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
